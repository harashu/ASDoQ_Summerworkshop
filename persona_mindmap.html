<script>
function svgText(){return new XMLSerializer().serializeToString(document.getElementById('map'));}
function save(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}
document.getElementById('svg').onclick=function(){save(new Blob([svgText()],{type:'image/svg+xml'}),'persona_mindmap.svg');};
document.getElementById('png').onclick=function(){
  var scale=3,img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');c.width=680*scale;c.height=940*scale;
    var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){save(b,'persona_mindmap.png');},'image/png');
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgText());
};
</script>
